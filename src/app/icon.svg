<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!--
    Ikon aplikasi dan favicon.

    Bentuknya sama dengan komponen Logo, namun ditempatkan di dalam kotak pekat
    karena favicon tampil di atas latar peramban yang tidak dapat dikendalikan.
    Tanpa kotak, tanda berwarna teal akan hilang pada tab bertema gelap.

    Gradasi dipakai alih-alih warna rata agar tetap terlihat berdimensi pada
    ukuran 16 piksel, di mana detail garis sudah tidak terbaca.
  -->
  <defs>
    <linearGradient id="latar" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f766e"/>
      <stop offset="1" stop-color="#083b37"/>
    </linearGradient>
  </defs>

  <rect width="48" height="48" rx="11" fill="url(#latar)"/>

  <!-- Naungan kader -->
  <path d="M11 30.5c0-8 5.8-13.5 13-13.5s13 5.5 13 13.5"
        stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.32"/>

  <!-- Kurva pertumbuhan -->
  <path d="M14 34.5l6-6 5 4 10-10.5"
        stroke="#ffffff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Titik kunjungan terakhir -->
  <circle cx="35" cy="22" r="3.4" fill="#ffffff"/>
</svg>
